<section class="afsluiter">
  <div class="afsluiter__vorm" aria-hidden="true"></div>
  <div class="wrap afsluiter__in">
    <h2>{{ include.kop | default: "Kom gewoon eens kijken." }}</h2>
    <p>{{ include.tekst | default: "Een rondleiding duurt maximaal 30 minuten. Je ziet de lokalen, ontmoet ons en stelt al je vragen. Daarna weet je of het Casteleijn College bij je past." }}</p>
    <div class="knoppen">
      <a class="knop knop--groot" href="{{ '/aanmelden/#kennismaken' | relative_url }}">Plan een rondleiding <svg aria-hidden="true" class="i"><use href="#i-pijl"/></svg></a>
      <a class="knop knop--groot knop--rand" href="tel:{{ site.data.school.telefoon_link }}">Bel {{ site.data.school.telefoon }}</a>
    </div>
  </div>
</section>
