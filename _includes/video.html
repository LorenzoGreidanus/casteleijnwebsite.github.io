{%- comment -%} Privacyvriendelijk: YouTube laadt pas na een klik. {%- endcomment -%}
<div class="video" data-video="{{ include.id }}">
  <img src="{{ include.poster | relative_url }}" alt="" loading="lazy">
  <button class="video__knop" type="button"><span class="video__play" aria-hidden="true"><svg class="i"><use href="#i-play"/></svg></span><span>{{ include.titel }}</span></button>
  <p class="video__info">Speelt af via YouTube, zonder tracking-cookies vooraf.</p>
</div>
<p class="video__alt">Werkt de film niet? <a href="https://www.youtube.com/watch?v={{ include.id }}">Bekijk hem op YouTube</a>.</p>
