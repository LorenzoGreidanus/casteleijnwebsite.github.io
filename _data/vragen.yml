# Veelgestelde vragen. "home: true" = ook tonen op de homepage.
- vraag: Voor wie is het Casteleijn College?
  antwoord: Voor jongeren die extra onderwijsondersteuning en begeleiding nodig hebben. Bijvoorbeeld omdat je autisme hebt en je je op een reguliere school niet op je plek voelt, of omdat je door je gedrag op een reguliere school niet aan leren toekomt.
  home: true
- vraag: Hoe groot zijn de klassen?
  antwoord: Een klas heeft 12 tot 13 leerlingen. Je mentor geeft een groot deel van de lessen en je hebt een vaste plek in de klas.
  home: true
- vraag: Wat heb ik nodig om me aan te melden?
  antwoord: Een toelaatbaarheidsverklaring (TLV) van het samenwerkingsverband in je woonplaats. In Emmeloord, Lemmer en Urk is dat Aandacht+. Met een TLV kun je je aanmelden.
  url: /aanmelden/#tlv
  home: true
- vraag: Kan ik eerst komen kijken?
  antwoord: Ja. Je ouders kunnen een oriëntatiebezoek aanvragen. Je krijgt een rondleiding van maximaal 30 minuten, en we nemen binnen een week contact op. Je kunt ook naar de informatieavond komen.
  url: /aanmelden/#kennismaken
  home: true
- vraag: Hoe laat begint en eindigt de school?
  antwoord: Elke dag van 08.30 tot 14.15 uur, van maandag tot en met vrijdag. Zo weet je altijd waar je aan toe bent.
  url: /ouders/#schooltijden
  home: true
- vraag: Kan ik bij jullie havo doen?
  antwoord: Sinds schooljaar 2024-2025 bieden we de havo-onderbouw aan. Je krijgt een uitdagend programma dat je voorbereidt op de bovenbouw van de havo.
  url: /leerwegen/havo/
- vraag: Kan ik een diploma halen?
  antwoord: In de leerweg vmbo-bb kun je zelfs een mbo-niveau 1-diploma halen; daarvoor werken we samen met het mbo. Bij interne stages kun je schoolcertificaten halen, bijvoorbeeld voor fietstechniek of catering.
  url: /toekomst/
- vraag: Vanaf wanneer loop ik stage bij een bedrijf?
  antwoord: Als je 15 jaar bent en de vaardigheden hebt die nodig zijn. Je leraar en de stagecoördinator bereiden de stage samen met je voor, en de stagecoördinator komt regelmatig langs.
  url: /toekomst/#stage
- vraag: Wie is mijn aanspreekpunt als ouder?
  antwoord: De mentor van je kind. De mentor is de spil in het contact tussen leerling, ouders en school.
  url: /ouders/
- vraag: Werken jullie samen met jeugdzorg?
  antwoord: Ja. Krijgt een leerling jeugdzorg, dan werken we nauw samen met de organisatie(s), zodat zorg en onderwijs goed op elkaar aansluiten.
  url: /school/#samen
