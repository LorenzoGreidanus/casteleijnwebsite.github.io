- id: vmbo-bb
  kort: Vmbo-bb
  naam: Vmbo basisberoepsgerichte leerweg
  focus: Vooral praktijk
  praktijk: 5
  intro: Veel praktijkvakken. Je leert door te doen en bereidt je voor op het mbo of op werk. Je kunt zelfs een mbo-niveau 1-diploma halen.
  tekst:
    - Als je de vmbo-bb leerweg volgt, krijg je veel praktijkgerichte vakken. Zo word je voorbereid op een beroep of een vervolgopleiding in het middelbaar beroepsonderwijs (mbo). Je kunt zelfs een mbo-niveau 1-diploma halen. Hiervoor werken we samen met het mbo.
    - Je leert praktische vaardigheden en wordt steeds zelfstandiger. Daarnaast werk je aan basisvaardigheden zoals taal en rekenen. Onze leraren zorgen voor een gestructureerde en veilige leeromgeving.
  na: [Mbo (niveau 1 of 2), Werk]
- id: vmbo-kb
  kort: Vmbo-kb
  naam: Vmbo kaderberoepsgerichte leerweg
  focus: Praktijk én theorie
  praktijk: 4
  intro: Een bredere basis. Praktijkvakken, samen met het regulier onderwijs, én theorievakken zoals Nederlands, Engels en wiskunde.
  tekst:
    - Als je de vmbo-kb leerweg volgt, krijg je een bredere basis dan in de vmbo-bb leerweg. De praktijkvakken organiseren we (vanaf 2025-2026) samen met het regulier onderwijs. Daarnaast krijg je theorievakken zoals Nederlands, Engels en wiskunde.
    - Je bereidt je voor op een vervolgopleiding op het mbo, of op doorstromen naar vmbo-tl. Onze docenten helpen je je talenten te ontdekken en te ontwikkelen.
  na: [Mbo (niveau 3 of 4), Vmbo-tl]
- id: vmbo-tl
  kort: Vmbo-tl
  naam: Vmbo theoretische leerweg
  focus: Vooral theorie
  praktijk: 2
  intro: Een breed pakket theorievakken, zoals Nederlands, Engels, wiskunde en biologie, met ook ruimte voor praktische vakken.
  tekst:
    - Als je de vmbo-tl leerweg volgt, krijg je een breed pakket aan theorievakken, waaronder Nederlands, Engels, wiskunde en biologie. Daarnaast is er ruimte voor praktische vakken.
    - Je bereidt je voor op een vervolgopleiding op het mbo. Onze docenten dagen je uit om je kennis en vaardigheden verder te ontwikkelen.
  na: [Mbo (niveau 3 of 4)]
- id: havo
  kort: Havo
  naam: Havo (onderbouw)
  focus: Theorie en onderzoek
  praktijk: 1
  intro: Sinds 2024-2025 in de onderbouw. Een uitdagend programma dat je voorbereidt op de bovenbouw van de havo.
  tekst:
    - Sinds schooljaar 2024-2025 bieden we in de onderbouw de leerweg havo aan. Je krijgt een uitdagend programma dat je voorbereidt op de bovenbouw van de havo. Naast Nederlands, Engels en wiskunde krijg je vakken als geschiedenis, aardrijkskunde, economie en biologie.
    - We leren je kritisch en analytisch denken, onderzoeken en zelfstandig werken. Onze leraren zorgen voor een inspirerende leeromgeving waarin je laat zien wat je kunt.
  na: [Bovenbouw havo]
