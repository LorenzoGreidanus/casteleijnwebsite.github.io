<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.url == '/' %}{{ site.title }} · Voortgezet speciaal onderwijs in Emmeloord{% else %}{{ page.title }} · {{ site.title }}{% endif %}</title>
  {%- assign beschrijving = page.description | default: page.intro | default: page.samenvatting | default: site.description | strip_newlines | strip %}
  <meta name="description" content="{{ beschrijving }}">
  <meta name="theme-color" content="#00233f">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ beschrijving }}">
  <meta property="og:image" content="{{ page.afbeelding | default: page.foto | default: '/assets/img/foto-tekenen.jpg' | absolute_url }}">
  <link rel="icon" href="{{ '/assets/img/favicon.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <script>document.documentElement.classList.add('js')</script>
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</head>
<body>
  {% include iconen.html %}
  {% include kop.html %}
  <main id="inhoud" tabindex="-1">
    {{ content }}
  </main>
  {% include voet.html %}
</body>
</html>
