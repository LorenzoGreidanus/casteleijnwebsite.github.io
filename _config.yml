title: Casteleijn College
description: >-
  Voortgezet speciaal onderwijs in Emmeloord. Vmbo-bb, vmbo-kb, vmbo-tl en havo-onderbouw
  in kleine klassen, met een vaste mentor en een voorspelbare schooldag.
lang: nl
url: "https://lorenzogreidanus.github.io"
baseurl: "/casteleijnwebsite.github.io"
permalink: /verhalen/:year/:month/:title/
timezone: Europe/Amsterdam
markdown: kramdown
collections:
  leerwegen:
    output: true
    permalink: /leerwegen/:name/
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
defaults:
  - scope: { path: "", type: posts }
    values: { layout: verhaal }
  - scope: { path: "", type: leerwegen }
    values: { layout: leerweg }
